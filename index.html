<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samaa Ear Trainer</title>
<meta name="description" content="Learn to play the oud by ear: hear a note, play it back, and get guided higher or lower until you hit it. Lessons in the Arabic maqamat.">
<meta name="theme-color" content="#12A182">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centered learning column, chunky tactile buttons, a winding lesson path per level. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --line:#DCE5E3; --ink:#1B2928; --muted:#667976;
  --primary:#12A182; --primary-d:#0B7A62; --sky:#2F8AE8; --sky-d:#1E66B3;
  --amber:#F2A22B; --amber-d:#C27A0C; --coral:#E5504A; --coral-d:#B13430;
  --violet:#8A5CF0; --violet-d:#6439C8; --wood:#B9773F; --wood-d:#7A4A22;
  --plum:#B8478F; --plum-d:#8C2E6B; --olive:#6E9420; --olive-d:#527013; --pearl:#1C9DC2; --pearl-d:#13748F;
  --ok-soft:#D7F4EA; --ok-ink:#0B7A62; --bad-soft:#FCE2E0; --bad-ink:#B13430;
  --lock:#E3E9E8; --lock-d:#C7D0CE; --lock-ink:#98A6A3; --key-black:#1B2928;
  --f-display:"Baloo Bhaijaan 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101817; --surface:#192423; --line:#2A3836; --ink:#E8F1EF; --muted:#8EA19D;
  --ok-soft:#14372E; --ok-ink:#5FD9B5; --pearl:#4CC3E6; --pearl-d:#2A8FB0; --bad-soft:#3B1E1D; --bad-ink:#FF8F89;
  --lock:#263230; --lock-d:#1A2422; --lock-ink:#5F716E; --key-black:#060B0A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101817; --surface:#192423; --line:#2A3836; --ink:#E8F1EF; --muted:#8EA19D;
  --ok-soft:#14372E; --ok-ink:#5FD9B5; --pearl:#4CC3E6; --pearl-d:#2A8FB0; --bad-soft:#3B1E1D; --bad-ink:#FF8F89;
  --lock:#263230; --lock-d:#1A2422; --lock-ink:#5F716E; --key-black:#060B0A; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--r);
  background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px;transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--primary-d)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.bad{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.wide{width:100%}
.link{color:var(--sky);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--primary)}
.brand small{font-size:15px;color:var(--muted);font-weight:700}
.stats{display:flex;gap:14px;font-weight:800}
.stat{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.fire{color:var(--amber)} .stat.xp{color:var(--violet)} .stat.heart{color:var(--coral)}
.stat.dim{color:var(--lock-ink)}

main{padding-block:20px 110px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;justify-content:space-around;height:64px;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 16px;border-radius:12px;border:2px solid transparent}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent);border-color:color-mix(in srgb,var(--sky) 40%,transparent)}

/* path */
.level{margin-bottom:36px}
.banner{border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 0 var(--c-d)}
.banner .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.banner h2{font-size:24px;margin:2px 0}
.banner p{margin:0;font-size:14px;opacity:.95;max-width:40ch}
.banner.locked{background:var(--lock)!important;color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-d)}
.soon .mini{width:12px;height:12px;vertical-align:-2px}
.soon{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:color-mix(in srgb,var(--lock-ink) 18%,transparent);padding:4px 8px;border-radius:999px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 0 6px;position:relative}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--c-d);display:grid;place-items:center;color:#fff;transition:transform .06s,box-shadow .06s}
.node svg{width:34px;height:34px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--c-d)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--lock-ink);cursor:not-allowed}
.node.current{outline:6px solid color-mix(in srgb,var(--c) 28%,transparent);outline-offset:6px}
.node-label{margin-top:12px;font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.start-tag{position:absolute;top:-38px;background:var(--surface);color:var(--c);border:2px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.1em;padding:5px 12px;border-radius:12px;animation:bob 1.4s ease-in-out infinite;white-space:nowrap}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.done-count{position:absolute;right:-6px;top:-4px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 6px;box-shadow:0 2px 0 var(--amber-d)}
.practice-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:28px}
.practice-card p{margin:2px 0 0;color:var(--muted);font-size:14px}
.practice-card>div{flex:1;min-width:0}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:grid;place-items:end center;padding:16px}
@media (min-width:640px){.modal{place-items:center}}
.card{width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line);margin-bottom:env(safe-area-inset-bottom,0px)}
.card.colored{background:var(--c);color:#fff;border:0}
.card.colored .btn{background:#fff;color:var(--c);box-shadow:0 4px 0 rgb(0 0 0 / .18)}
.card h3{font-size:24px}
.card p{margin:0}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row .btn{flex:1}

/* lesson */
.lesson{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson .wrap{max-width:1000px}
.lhead .wrap{display:flex;align-items:center;gap:14px;height:clamp(48px,8vh,64px)}
.kbd-hint{display:none;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.kbd-hint kbd{font:800 11px var(--f-body);border:2px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 5px;margin:0 2px;color:var(--ink)}
@media (min-width:900px) and (hover:hover){.kbd-hint{display:inline}}
.x{width:36px;height:36px;display:grid;place-items:center;color:var(--lock-ink);border-radius:10px}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;background:var(--lock);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgb(255 255 255 / .3)}
.lbody{flex:1;overflow-y:auto}
.lbody .wrap{padding-block:clamp(6px,1.6vh,14px) clamp(10px,2vh,24px);display:flex;flex-direction:column;gap:clamp(8px,1.8vh,18px);min-height:100%}
.ex-title{font-size:clamp(20px,3.4vh,26px)}
/* exercise grid: prompt and input side by side on laptops so nothing scrolls */
.ex-grid{display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}
.ex-main{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);min-width:0}
.ex-side{min-width:0}
@media (min-width:900px){
  .ex-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;flex:1}
  .lbody .wrap.center{justify-content:center}
}
.ex-sub{margin:-8px 0 0;color:var(--muted)}
.listen-row{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding:8px 0}
.speak{width:clamp(80px,15vh,120px);height:clamp(80px,15vh,120px);border-radius:24px;background:var(--sky);box-shadow:0 6px 0 var(--sky-d);color:#fff;display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
.speak svg{width:46%;height:46%}
.speak.small{width:clamp(52px,9vh,72px);height:clamp(52px,9vh,72px);border-radius:18px}
.speak.small svg{width:34px;height:34px}
.speak:active:not(:disabled){transform:translateY(6px);box-shadow:0 0 0 var(--sky-d)}
.speak:disabled{background:var(--lock);box-shadow:0 6px 0 var(--lock-d);color:var(--lock-ink)}
.speak.playing{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.15)}}
.replays{margin:0;text-align:center;color:var(--muted);font-size:14px;font-weight:700;min-height:20px}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--lock-ink);background:var(--surface)}
.slot.active{border:2px solid var(--sky);color:var(--sky)}
.slot.ok{border:2px solid var(--primary);background:var(--ok-soft);color:var(--ok-ink)}
.slot.shake{animation:shake .35s;border-color:var(--coral);color:var(--coral)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.listen{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.listen-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mic-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lock-ink)}
.dot.on{background:var(--coral);animation:pulse .6s infinite alternate}
.heard{display:flex;align-items:baseline;gap:10px;min-height:44px}
.heard b{font-family:var(--f-display);font-size:34px;font-weight:800}
.heard span{color:var(--muted);font-size:14px}
.meter{position:relative;height:42px}
.meter .track{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--coral),var(--amber) 35%,var(--primary) 46%,var(--primary) 54%,var(--amber) 65%,var(--coral))}
.meter .mid{position:absolute;left:50%;top:8px;width:3px;height:28px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.meter .mark{position:absolute;top:10px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);transition:left .08s linear}
.meter-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hint{margin:0;font-weight:700;min-height:24px;color:var(--ink)}
.hint.bad{color:var(--bad-ink)}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.choice{min-height:64px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:18px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.choice small{font-weight:700;font-size:13px;color:var(--muted)}
.choice{position:relative}
.choice .kbd-hint{position:absolute;top:6px;right:8px}
.choice[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--surface));box-shadow:0 4px 0 var(--sky);color:var(--sky)}
.choice:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.choice:disabled{cursor:default}
.lfoot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.lfoot .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:clamp(10px,2vh,16px);flex-wrap:wrap}
.lfoot.ok{background:var(--ok-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.verdict{display:flex;gap:12px;align-items:center;flex:1 1 260px;min-width:0}
.verdict .badge{width:52px;height:52px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.verdict .badge svg{width:30px;height:30px}
.verdict h3{font-size:22px}
.lfoot.ok h3,.lfoot.ok .badge{color:var(--ok-ink)}
.lfoot.bad h3,.lfoot.bad .badge{color:var(--bad-ink)}
.verdict p{margin:2px 0 0;font-weight:700}
.lfoot.ok .verdict p{color:var(--ok-ink)} .lfoot.bad .verdict p{color:var(--bad-ink)}
.lfoot .btn{min-width:150px}
@media (max-width:480px){.lfoot .btn{flex:1}}

/* keyboard fallback */
.keys{position:relative;height:clamp(110px,19vh,150px);display:flex;user-select:none;touch-action:manipulation}
.wk{flex:1;border:2px solid var(--line);border-radius:0 0 10px 10px;background:var(--surface);box-shadow:0 4px 0 var(--line);margin:0 1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:800;font-size:13px;color:var(--muted)}
.bk{position:absolute;top:0;width:8%;height:60%;background:var(--key-black);border:2px solid var(--line);border-top:0;border-radius:0 0 8px 8px;z-index:2;box-shadow:0 3px 0 rgb(0 0 0 / .5)}
.wk:active,.wk.hit{background:color-mix(in srgb,var(--sky) 22%,var(--surface))}
.bk:active,.bk.hit{background:var(--sky)}

/* maqam note pad (on-screen input with quarter tones) */
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.pk{border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 4px 0 var(--line);padding:10px 4px;font-weight:800;font-size:16px}
.pk small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.pk:active,.pk.hit{transform:translateY(4px);box-shadow:0 0 0 var(--line);border-color:var(--sky)}

/* maqam picker */
.pick{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.pick h2{font-size:24px}
.pick>p{margin:4px 0 0;color:var(--muted)}
.mq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.mq{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 4px 0 var(--line);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mq[aria-pressed="true"]{border-color:var(--c);box-shadow:0 4px 0 var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.mq:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.mq-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mq b{font-size:17px}
.mq .ar{font-family:var(--f-display);font-size:22px;color:var(--c);font-weight:800;line-height:1}
.mq .meta{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.pbar{height:6px;background:var(--lock);border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.scale-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.scale-chips .slot{width:auto;min-width:62px;padding:6px 8px;flex-direction:column;display:flex;align-items:center;justify-content:center;line-height:1.1;border-style:solid;color:var(--ink)}
.scale-chips .slot small{font-size:11px;color:var(--muted);font-family:var(--f-body)}
.scale-chips .slot.lit{background:var(--sky);border-color:var(--sky);color:#fff}
.scale-chips .slot.lit small{color:#fff}

/* top-bar stat buttons, toasts */
button.stat{padding:6px 5px;border-radius:10px}
button.stat:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.stat.pearl{color:var(--pearl)}
.x2{font-size:10px;font-weight:900;background:var(--violet);color:#fff;border-radius:6px;padding:1px 4px;margin-left:2px}
@media (max-width:460px){.brand .word,.brand small{display:none}.stats{gap:4px}.stat svg{width:20px;height:20px}}
.toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;width:min(calc(100vw - 32px),380px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgb(0 0 0 / .2);font-weight:800;animation:tin .3s ease-out}
.toast svg{width:24px;height:24px;flex:none;color:var(--pearl)}
.toast span{flex:1;min-width:0}
.toast b{color:var(--pearl);white-space:nowrap}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.combo{display:inline-block;margin-left:8px;font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:#fff;padding:3px 8px;border-radius:999px;vertical-align:middle}

/* learn: today panel + quests */
.today-row{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.today-row .practice-card{margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head a,.panel-head .link{padding:0}
.notice{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--sky) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--sky) 40%,transparent);font-weight:700}
.notice svg{width:24px;height:24px;color:var(--sky);flex:none}
.quests{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.quest{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.qi svg{width:24px;height:24px}
.quest b{font-size:15px;display:block}
.qbar{height:16px;border-radius:9px;background:var(--lock);overflow:hidden;margin-top:5px;position:relative}
.qbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.qbar em{position:absolute;inset:0;font-size:11px;font-style:normal;font-weight:800;display:grid;place-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
.reward{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--pearl);font-size:15px;font-variant-numeric:tabular-nums}
.reward svg{width:20px;height:20px}
.quest.done .reward{color:var(--primary)}
.quest.done .qi{background:var(--primary);color:#fff}

/* profile */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:116px;height:116px;border-radius:50%;background:color-mix(in srgb,var(--amber) 20%,var(--surface));border:4px solid var(--amber);display:grid;place-items:center;flex:none;position:relative}
.avatar .mascot{width:94px;height:94px}
.avatar button{position:absolute;right:-4px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--sky-d)}
.avatar button svg{width:20px;height:20px}
.hero-info{flex:1;min-width:190px;display:flex;flex-direction:column;gap:6px}
.name-input{font:800 28px/1.1 var(--f-display);color:var(--ink);background:transparent;border:2px dashed transparent;border-radius:10px;padding:2px 6px;margin-left:-8px;width:100%}
.name-input:hover,.name-input:focus{border-color:var(--line);outline:none}
.hero-info p{margin:0;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--lock);color:var(--muted)}
@media (min-width:520px){.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week span{font-size:12px;font-weight:800;color:var(--muted)}
.wd{width:36px;height:36px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;background:var(--lock);color:var(--lock-ink)}
.wd svg{width:20px;height:20px}
.wd.on{background:var(--amber);color:#fff}
.wd.frz{background:var(--sky);color:#fff}
.wd.today{outline:3px dashed var(--amber);outline-offset:2px}
.streak-big{display:flex;align-items:center;gap:14px}
.streak-big svg{width:58px;height:58px;color:var(--amber);flex:none}
.streak-big b{font:800 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.streak-big p{margin:0;color:var(--muted);font-weight:800}
.muted-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;margin:0}
.muted-line svg{width:20px;height:20px;color:var(--sky);flex:none}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:160px;align-items:end;position:relative}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;position:relative;z-index:1}
.bar-col i{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--violet)}
.bar-col.today i{background:var(--amber)}
.bar-col em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;height:16px;line-height:16px}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55}
.goal-line span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:800;color:var(--muted)}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.bdg{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:var(--r)}
.bi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 4px 0 var(--c-d);flex:none}
.bi svg{width:30px;height:30px}
.bdg.locked .bi{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-d)}
.bdg>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bdg p{margin:0;font-size:13px;color:var(--muted)}
.bdg .qbar{height:10px;margin:0}

/* shop */
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wallet{display:flex;align-items:center;gap:6px;font:800 26px var(--f-display);color:var(--pearl);font-variant-numeric:tabular-nums}
.wallet svg{width:30px;height:30px}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.ii{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.ii svg{width:36px;height:36px}
.item>div{flex:1;min-width:150px}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.price{min-width:116px}
.price svg,.gear .btn svg,#refill svg{width:18px;height:18px}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gear{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gear .mascot{width:92px;height:92px}
.gear.worn{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.gear .btn{width:100%;min-height:42px;font-size:13px;padding:0 10px}
.hearts-row{display:flex;gap:6px;color:var(--coral)}
.hearts-row svg{width:34px;height:34px}
.hearts-row .empty{color:var(--lock)}
.streak-hero{position:relative;width:150px;height:150px;color:var(--amber)}
.streak-hero svg{width:150px;height:150px}
.streak-hero b{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);color:#fff;font:800 44px/1 var(--f-display);text-align:center}
@media (max-width:480px){.result-tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}}

/* end-of-lesson screens scale with the window height */
.complete .mascot{width:clamp(72px,15vh,150px);height:clamp(72px,15vh,150px)}
.complete h2{font-size:clamp(24px,4.5vh,34px)}
.complete p{margin:0}
.rt b{padding:clamp(6px,1.6vh,12px) 4px}
.streak-hero{width:clamp(90px,19vh,150px);height:clamp(90px,19vh,150px)}
.streak-hero svg{width:100%;height:100%}
.tip .mascot{width:clamp(64px,12vh,96px);height:clamp(64px,12vh,96px)}
/* short phone screens (iPhone SE and similar): compact exercise layout */
@media (max-width:899px) and (max-height:760px){
  .speak{width:64px;height:64px;border-radius:18px;box-shadow:0 4px 0 var(--sky-d)}
  .speak.small{width:48px;height:48px;border-radius:14px}
  .listen-row{padding:0}
  .replays{font-size:12px;min-height:0}
  .slot{width:46px;height:46px;font-size:17px;border-radius:12px}
  .listen{padding:10px 12px;gap:6px}
  .heard{min-height:30px} .heard b{font-size:24px}
  .meter{height:34px} .meter .track{top:14px} .meter .mid{top:5px} .meter .mark{top:7px}
  .keys{height:96px}
  .pad{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
  .pk{padding:5px 2px;font-size:14px;border-radius:10px} .pk small{font-size:10px}
  .gauge{max-width:min(260px,31vh)}
  .ex-sub{font-size:13px}
  .hint{font-size:14px;min-height:0}
  .lfoot .btn{min-height:44px}
  .verdict .badge{width:40px;height:40px} .verdict h3{font-size:18px} .verdict p{font-size:14px}
  .ex-main .listen-row + .replays{margin-top:-4px}
}
/* five tabs fit a phone */
.nav button{padding:6px 10px}
@media (max-width:380px){.nav button{font-size:10px;padding:6px 6px;letter-spacing:.04em}}

/* welcome, sign-in, onboarding */
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-height:700px){.auth{align-items:center}}
.auth-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.auth-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.auth-hero .mascot{width:clamp(96px,18vh,150px);height:clamp(96px,18vh,150px)}
.auth-hero h1{font-size:clamp(34px,6vh,44px);color:var(--primary)}
.auth-hero h1 small{font-size:.6em;color:var(--muted)}
.auth-hero p{margin:0;color:var(--muted);font-weight:700;font-size:17px;max-width:32ch}
.perks{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.perk{display:flex;gap:12px;align-items:center;font-weight:700}
.perk .qi{flex:none}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:6px}
.form input{font:600 16px var(--f-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
.form input:focus{border-color:var(--sky);outline:none}
.form-err{margin:0;color:var(--bad-ink);font-weight:700;min-height:1.2em}
.form-note{margin:0;color:var(--muted);font-size:14px;text-align:center}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;padding:6px 0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:9px;background:var(--lock)}
.steps i.on{background:var(--primary)}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 4px 0 var(--line);padding:14px 16px;font-weight:800}
.opt small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 4px 0 var(--sky);background:color-mix(in srgb,var(--sky) 10%,var(--surface))}
.opt .qi{flex:none}
.cal-meter{height:14px;border-radius:9px;background:var(--lock);overflow:hidden}
.cal-meter i{display:block;height:100%;width:0;background:var(--sky);transition:width .08s}
.cal-step{display:flex;gap:12px;align-items:center;font-weight:700}
.cal-step .qi{flex:none}
.cal-step.done .qi{background:var(--primary);color:#fff}

/* banners, league, ear map, account */
.banner-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--primary) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--primary) 40%,transparent)}
.banner-cta>div{flex:1;min-width:180px}
.banner-cta p{margin:2px 0 0;color:var(--muted);font-size:14px}
.league-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:36px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:2px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.me{background:color-mix(in srgb,var(--sky) 12%,transparent);border-radius:12px}
.lrow .rank{font:800 18px var(--f-display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .rank.top{color:var(--amber)}
.ini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c)}
.lrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .xpv{font-weight:800;color:var(--violet);font-variant-numeric:tabular-nums}
.ear-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ear{border-radius:12px;padding:8px;text-align:center;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.ear b{display:block;font-size:17px}
.ear span{font-size:12px;font-weight:800;color:var(--c)}
.ear small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.acct{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.acct>div{flex:1;min-width:180px}
.acct p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--primary)}
.sync.off{color:var(--muted)} .sync.err{color:var(--bad-ink)}

/* tuner + gauge */
.gauge{display:block;width:100%;max-width:min(340px,46vh);margin:0 auto}
.gauge .needle{transition:transform .1s linear}
.big-note{text-align:center}
.big-note b{font-family:var(--f-display);font-size:72px;font-weight:800;line-height:1}
.big-note p{margin:4px 0 0;color:var(--muted);font-weight:700}
.big-note .ar{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.str{border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);padding:8px 2px;text-align:center;font-weight:800}
.str small{display:block;color:var(--muted);font-size:11px}
.str.near{border-color:var(--primary);color:var(--ok-ink);background:var(--ok-soft)}
.hold{height:10px;border-radius:9px;background:var(--lock);overflow:hidden}
.hold i{display:block;height:100%;width:0;background:var(--primary);transition:width .1s}

/* panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;background:var(--surface)}
.tile svg{width:28px;height:28px;flex:none}
.tile b{display:block;font-size:22px;font-family:var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line);flex-wrap:wrap}
.field:first-of-type{border-top:0}
.field label{font-weight:800}
.field p{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:8px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff}
input[type=range]{accent-color:var(--sky);width:160px}
.section-title{font-size:28px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.goal{height:14px;border-radius:9px;background:var(--lock);overflow:hidden}
.goal i{display:block;height:100%;background:var(--amber)}

/* complete */
.complete{align-items:center;text-align:center;justify-content:center}
.complete h2{font-size:34px;color:var(--amber)}
.result-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.rt{border:2px solid var(--c);border-radius:var(--r);overflow:hidden;background:var(--c)}
.rt span{display:block;color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.rt b{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--surface);color:var(--c);font-size:22px;padding:12px 4px;border-radius:12px 12px 0 0;font-variant-numeric:tabular-nums}
.mascot{width:150px;height:150px}
.mascot.bounce{animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-10px) rotate(-3deg)}}
.tip{display:flex;gap:14px;align-items:flex-start}
.tip .mascot{width:96px;height:96px;flex:none}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;flex:1;min-width:0}
.bubble p{margin:0 0 8px} .bubble p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const icon = (id, cls='') => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- notes ---------- */
/* Notes live on a quarter-tone grid: q = quarter steps above C (0..23). Arabic names are the
   traditional note names of the Rast-on-C system (Rast, Dukah, Sikah, Jaharkah, Nawa…). */
const WEST = {0:'C',2:'C♯',4:'D',6:'E♭',7:'E½♭',8:'E',10:'F',12:'F♯',14:'G',16:'A♭',18:'A',20:'B♭',21:'B½♭',22:'B'};
const ARN  = {0:'راست',2:'زركلاه',4:'دوكاه',6:'كرد',7:'سيكاه',8:'بوسليك',10:'جهاركاه',12:'حجاز',14:'نوا',16:'حصار',18:'حسيني',20:'عجم',21:'أوج',22:'ماهور'};
const ARL  = {0:'Rast',2:'Zirkulah',4:'Dukah',6:'Kurd',7:'Sikah',8:'Busalik',10:'Jaharkah',12:'Hijaz',14:'Nawa',16:'Hisar',18:'Husayni',20:'Ajam',21:'Awj',22:'Mahur'};
const SOL  = {C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
let GRID = 1, SPELL = {};      // GRID: 1 = semitones (Level 1), 0.5 = quarter tones (maqam routes)
const pc = m => ((Math.round(m) % 12) + 12) % 12;
const qOf = m => ((Math.round(Math.round(m / GRID) * GRID * 2) % 24) + 24) % 24;
const oct = m => Math.floor(Math.round(m) / 12) - 1;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const ftom = f => 69 + 12 * Math.log2(f / 440);
const fold = d => ((d + 6) % 12 + 12) % 12 - 6;     // interval folded into one octave, -6..+6
const west = m => { const q = qOf(m); return SPELL[q] || WEST[q] || `${WEST[q - 1]}+¼`; };
const solf = w => SOL[w[0]] + w.slice(1);
const name = m => S.settings.names === 'solfege' ? solf(west(m)) : west(m);
const sub = m => { const w = west(m), ar = ARN[qOf(m)]; return `${S.settings.names === 'solfege' ? w : solf(w)}${ar ? ` · ${ar}` : ''}`; };
const semis = n => `${n} half step${n === 1 ? '' : 's'}`;
const gapText = g => g === 0.5 ? 'a quarter tone' : Number.isInteger(g) ? semis(g) : `${g * 2} quarter tones`;

/* oud tunings, lowest course to highest */
const TUNINGS = {
  FF:{ label:'F to F', notes:[41,45,50,55,60,65] },   // F2 A2 D3 G3 C4 F4
  CC:{ label:'C to C', notes:[36,41,45,50,55,60] },   // C2 F2 A2 D3 G3 C4
};
const COURSE = ['6th', '5th', '4th', '3rd', '2nd', '1st (highest)'];
const oudStrings = () => (TUNINGS[S.settings.tuning] || TUNINGS.FF).notes.map((m, i) => ({ m, label:COURSE[i] }));
const SCALE = [48,50,52,53,55,57,59,60];   // C Ajam (major) in first position: C3–C4

/* ---------- state ---------- */
const KEY = 'samaa.v1';
const DEFAULT = { xp:0, streak:0, bestStreak:0, lastDay:null, done:{}, daily:{}, lessons:0,
  pearls:50, freezes:0, frozen:[], boostUntil:0, perfects:0, badges:[], chests:[], joined:null, player:'Oud player', goal:20,
  q:{ date:null }, gear:{ owned:[], worn:null }, notice:null, ear:{}, onboarded:false, guest:false, owner:null,
  maqam:'rast', settings:{ names:'western', sens:6, tap:false, tuning:'FF', mic2:true, volume:0.8, tonic:true, theme:'system' } };
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return {...JSON.parse(JSON.stringify(DEFAULT)), ...s, settings:{...DEFAULT.settings, ...(s.settings||{})}}; } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
const S = load();
function save(){ S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} Cloud.queue(); }
/* replace the whole state in place (S is shared by reference everywhere) */
function replaceState(next){
  for (const k of Object.keys(S)) delete S[k];
  const d = JSON.parse(JSON.stringify(DEFAULT));
  Object.assign(S, d, next, { settings:{ ...d.settings, ...((next && next.settings) || {}) } });
}
/* ISO week, e.g. 2026-W45: the league resets every Monday */
function weekKey(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return `${t.getUTCFullYear()}-W${String(Math.ceil(((t - y0) / 864e5 + 1) / 7)).padStart(2, '0')}`;
}
function weekXp(){
  const now = new Date(), back = (now.getDay() + 6) % 7; let sum = 0;   // Monday .. today
  for (let i = 0; i <= back; i++){ const d = new Date(); d.setDate(d.getDate() - i); sum += S.daily[dayKey(d)] || 0; }
  return sum;
}
const hasProgress = st => !!st && ((st.xp || 0) > 0 || Object.keys(st.done || {}).length > 0);
/* guest progress + an existing account: keep the best of both */
function mergeStates(a, b){
  const [hi, lo] = (a.xp || 0) >= (b.xp || 0) ? [a, b] : [b, a];
  const m = JSON.parse(JSON.stringify(hi));
  const maxMap = k => { m[k] = m[k] || {}; for (const [x, v] of Object.entries(lo[k] || {})) m[k][x] = Math.max(m[k][x] || 0, v); };
  maxMap('done'); maxMap('daily');
  const union = (o, k) => [...new Set([...(o[k] || []), ...((k === 'owned' ? lo.gear?.owned : lo[k]) || [])])];
  m.badges = union(m, 'badges'); m.chests = union(m, 'chests'); m.frozen = union(m, 'frozen');
  m.gear = m.gear || { owned:[], worn:null }; m.gear.owned = union(m.gear, 'owned');
  m.pearls = Math.max(m.pearls || 0, lo.pearls || 0); m.bestStreak = Math.max(m.bestStreak || 0, lo.bestStreak || 0);
  m.ear = m.ear || {}; for (const [x, [h, ms]] of Object.entries(lo.ear || {})){ const c = m.ear[x] || [0, 0]; m.ear[x] = [c[0] + h, c[1] + ms]; }
  return m;
}

/* ---------- accounts & cloud save (Supabase) ----------
   Fill in config.js to switch accounts on. Without it the app runs in guest mode on this device. */
const CFG = window.SAMAA_CONFIG || {};
const Cloud = {

    }
  },
  queue(){ if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1200); },
  async push(){
    if (!this.user) return;
    const { error } = await this.sb.from('profiles').upsert({
      id:this.user.id, display_name:(S.player || 'Oud player').slice(0, 24), state:S,
      week_xp:weekXp(), week_key:weekKey(), updated_at:new Date().toISOString(),
    });
    this.status = error ? 'error' : 'saved'; paintSync();
  },
  async pull(){
    const { data, error } = await this.sb.from('profiles').select('state').eq('id', this.user.id).maybeSingle();
    if (error) throw error;
    return data && data.state && Object.keys(data.state).length ? data.state : null;
  },
};
function paintSync(){
  const el = $('#syncState'); if (!el) return;
  el.className = `sync ${Cloud.status === 'error' ? 'err' : Cloud.user ? '' : 'off'}`;
  el.textContent = !Cloud.user ? 'Saved on this device only' : Cloud.status === 'error' ? 'Could not save. Retrying on your next change.' : 'Saved to your account';
}
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(new Date(y, m - 1, d).getTime() / 864e5); };
/* On open: spend streak freezes on missed days, or the streak resets. */
function settleStreak(){
  if (!S.lastDay) return;
  const missed = dayNum(dayKey()) - dayNum(S.lastDay) - 1;
  if (missed < 1) return;
  if (S.streak > 0 && S.freezes >= missed){
    for (let i = 1; i <= missed; i++){ const d = new Date(); d.setDate(d.getDate() - i); S.frozen.push(dayKey(d)); }
    S.freezes -= missed;
    const y = new Date(); y.setDate(y.getDate() - 1); S.lastDay = dayKey(y);
    S.notice = `${missed > 1 ? `${missed} streak freezes` : 'A streak freeze'} saved your ${S.streak}-day streak.`;
  } else S.streak = 0;
  save();
}
/* today's counters for daily quests */
function today(){ if (S.q.date !== dayKey()) S.q = { date:dayKey(), xp:0, combo:0, lessons:0, claimed:[] }; return S.q; }
function liveStreak(){
  const y = new Date(); y.setDate(y.getDate()-1);
  return (S.lastDay === dayKey() || S.lastDay === dayKey(y)) ? S.streak : 0;
}

/* ---------- audio: plucked-string synth (Karplus–Strong) ---------- */
let ctx = null, bodyIn = null, master = null;
async function ensureCtx(){
  if (!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:'interactive' });
    // a little "wooden body": low resonance + soft top end
    const res = ctx.createBiquadFilter(); res.type = 'peaking'; res.frequency.value = 210; res.Q.value = 1.2; res.gain.value = 5;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800;
    const out = ctx.createGain(); out.gain.value = 0.9 * (S.settings.volume ?? 0.8) / 0.8; master = out;
    res.connect(lp).connect(out).connect(ctx.destination);
    bodyIn = res;
  }
  if (ctx.state === 'suspended') await ctx.resume();
  return ctx;
}
const pluckCache = new Map();
function pluckBuffer(m){
  if (pluckCache.has(m)) return pluckCache.get(m);
  const sr = ctx.sampleRate, f = mtof(m), dur = 2.4, len = Math.floor(sr * dur);
  const y = new Float32Array(len);
  const D = sr / f - 0.5;                 // averaging filter adds half a sample of delay
  const n0 = Math.ceil(D) + 2;
  let lp = 0;
  for (let i = 0; i < n0; i++){ lp = lp * 0.45 + (Math.random()*2 - 1) * 0.55; y[i] = lp; }  // plectrum noise burst
  const t60 = Math.max(1.2, 3.2 - (m - 36) * 0.06);
  const g = Math.pow(0.001, 1 / (f * t60));
  for (let i = n0; i < len; i++){
    const p = i - D, i0 = Math.floor(p), fr = p - i0;
    const a = y[i0] + (y[i0+1] - y[i0]) * fr;
    const b = y[i0-1] + (y[i0] - y[i0-1]) * fr;
    y[i] = g * 0.5 * (a + b);
  }
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(y[i]));
  const fade = Math.floor(sr * 0.06);
  for (let i = 0; i < len; i++){ y[i] /= (peak || 1); if (i > len - fade) y[i] *= (len - i) / fade; }
  const buf = ctx.createBuffer(1, len, sr); buf.copyToChannel(y, 0);
  pluckCache.set(m, buf); return buf;
}
function playNote(m, when, dur){
  const src = ctx.createBufferSource(); src.buffer = pluckBuffer(m);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.55, when); g.gain.setTargetAtTime(0, when + dur, 0.05);
  src.connect(g).connect(bodyIn); src.start(when); src.stop(when + dur + 0.5);
}
/* Plays notes in order. The mic ignores everything until the sound has died down. */
async function playSeq(notes, noteDur = 0.9){
  await ensureCtx();
  const t0 = ctx.currentTime + 0.06;
  notes.forEach((m, i) => playNote(m, t0 + i * noteDur, i === notes.length - 1 ? Math.max(noteDur, 1.1) : noteDur * 0.96));
  const total = (notes.length - 1) * noteDur + Math.max(noteDur, 1.1) + 0.15;
  Mic.muteFor(total * 1000 + 120);   // the note has faded to ~2% by then
  await sleep(total * 1000);
}
async function sfx(ok){
  await ensureCtx();
  const t = ctx.currentTime + 0.01;
  const tones = ok ? [[1046.5, 0], [1568, 0.09]] : [[220, 0], [196, 0.12]];
  for (const [f, dt] of tones){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.22, t + dt + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.22);
    o.connect(g).connect(ctx.destination); o.start(t + dt); o.stop(t + dt + 0.25);
  }
  Mic.muteFor(400);
}

/* ---------- pitch detection ----------
   How a pluck becomes a note, in order:
   1. audio-thread capture: an AudioWorklet hands over 512 samples (~11 ms) at a time, so analysis runs
      ~90×/s and is not tied to screen refresh (falls back to an AnalyserNode + animation frames)
   2. band-pass 60 Hz–1.5 kHz before anything else: drops hum, rumble, hiss and most consonant noise
   3. a room-noise gate on the newest 21 ms, and a pluck detector (full level within ~5 ms)
   4. YIN on a 2× downsampled window: 4× less work per frame
   5. octave guard: if the dip at twice the period is far deeper, the fundamental was weak (low courses)
   6. clarity-weighted median over the last ~60 ms, steady within a third of a semitone
   7. hysteresis between neighbouring notes / quarter tones, so the reading doesn't flicker
   8. adaptive confirmation: a strong, clear pluck is confirmed in ~70 ms, a borderline one in ~150 ms
   9. pluck-decay check: a string fades after the pluck, a voice swells, so voices are refused
   10. Samaa's own notes are muted precisely, and the tuner needle is smoothed */
const yinD = new Float32Array(1024);
function yin(x, sr, thr = 0.12){
  const W = 512, tauMin = Math.max(2, Math.floor(sr / 1000)), tauMax = Math.min(Math.floor(sr / 60), x.length - W - 1);
  let run = 0; yinD[0] = 1;
  for (let tau = 1; tau <= tauMax; tau++){
    let s = 0;
    for (let i = 0; i < W; i++){ const d = x[i] - x[i + tau]; s += d * d; }
    run += s; yinD[tau] = run ? s * tau / run : 1;
  }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++){
    if (yinD[t] < thr){ while (t + 1 <= tauMax && yinD[t + 1] < yinD[t]) t++; tau = t; break; }
  }
  if (tau < 0) return null;
  // octave guard
  const t2 = tau * 2;
  if (t2 + 2 <= tauMax){
    let best = t2; for (let j = t2 - 2; j <= t2 + 2; j++) if (yinD[j] < yinD[best]) best = j;
    if (yinD[tau] > 0.04 && yinD[best] < yinD[tau] * 0.4) tau = best;   // only when the first match was a weak one
  }
  const x0 = yinD[tau - 1], x1 = yinD[tau], x2 = tau < tauMax ? yinD[tau + 1] : x1;
  const den = x0 + x2 - 2 * x1;
  return { f:sr / (den ? tau + (x0 - x2) / (2 * den) : tau), clarity:1 - x1 };
}

/* RBJ biquad, run in JS on each incoming chunk (so the band-pass is identical everywhere) */
function biquad(type, f, sr, q = 0.707){
  const w = 2 * Math.PI * f / sr, cs = Math.cos(w), al = Math.sin(w) / (2 * q);
  const b = type === 'lp' ? [(1 - cs) / 2, 1 - cs, (1 - cs) / 2] : [(1 + cs) / 2, -(1 + cs), (1 + cs) / 2];
  const a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
  const B0 = b[0] / a0, B1 = b[1] / a0, B2 = b[2] / a0, A1 = a1 / a0, A2 = a2 / a0;
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  return buf => { for (let i = 0; i < buf.length; i++){ const x = buf[i], y = B0 * x + B1 * x1 + B2 * x2 - A1 * y1 - A2 * y2; x2 = x1; x1 = x; y2 = y1; y1 = y; buf[i] = y; } };
}
const TAP_WORKLET = `class SamaaTap extends AudioWorkletProcessor{
  constructor(){ super(); this.b = new Float32Array(512); this.n = 0; }
  process(inputs){ const ch = inputs[0] && inputs[0][0];
    if (ch){ this.b.set(ch, this.n); this.n += ch.length; if (this.n >= 512){ this.port.postMessage(this.b.slice(0)); this.n = 0; } }
    return true; } }
registerProcessor('samaa-tap', SamaaTap);`;

const Mic = {
  running:false, error:null, subs:new Set(), muteUntil:0, hist:[], cur:null,
  cand:null, candSince:0, lastEmit:null, silentSince:0, stableMs:150, grid:1, floor:0.002, attackT:-1e9, attackPeak:0,
  N:4096, ring:null, dec:new Float32Array(1024),
  on(fn){ this.subs.add(fn); return () => this.subs.delete(fn); },
  emit(e){ for (const fn of [...this.subs]) fn(e); },
  muteFor(ms){ this.muteUntil = Math.max(this.muteUntil, performance.now() + ms); this.reset(); },
  reset(){ this.hist = []; this.cand = null; this.lastEmit = null; this.cur = null; this.attackT = -1e9; this.attackPeak = 0; },
  async start(){
    if (this.running) return true;
    try {
      await ensureCtx();
      const stream = await navigator.mediaDevices.getUserMedia({ audio:{ channelCount:1, echoCancellation:false, noiseSuppression:false, autoGainControl:false, latency:0 } });
      const src = ctx.createMediaStreamSource(stream);
      this.ring = new Float32Array(this.N);
      if (ctx.audioWorklet && window.AudioWorkletNode){
        const lp = src;   // the band-pass runs in feed()
        try {
          const url = URL.createObjectURL(new Blob([TAP_WORKLET], { type:'application/javascript' }));
          await ctx.audioWorklet.addModule(url);
          const node = new AudioWorkletNode(ctx, 'samaa-tap');
          const sink = ctx.createGain(); sink.gain.value = 0;          // keeps the node running, silently
          lp.connect(node); node.connect(sink).connect(ctx.destination);
          node.port.onmessage = ev => this.feed(ev.data, performance.now());
          this.running = true; this.error = null; this.mode = 'worklet';
          return true;
        } catch(e){ /* fall back to the analyser below */ }
      }
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 60; hp.Q.value = 0.7;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = 0.7;
      this.an = ctx.createAnalyser(); this.an.fftSize = this.N; src.connect(hp).connect(lp).connect(this.an);
      this.buf = new Float32Array(this.N);
      this.running = true; this.error = null; this.mode = 'frames';
      const loop = () => { this.tick(); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      return true;
    } catch (e){ this.error = e; return false; }
  },
  feed(chunk, t){
    if (!this.bp){ const h = biquad('hp', 60, ctx.sampleRate), l = biquad('lp', 1500, ctx.sampleRate); this.bp = b => { h(b); l(b); }; }
    this.bp(chunk);
    const r = this.ring || (this.ring = new Float32Array(this.N));
    r.copyWithin(0, chunk.length); r.set(chunk, this.N - chunk.length);
    this.analyse(r, t, chunk.length);
  },
  tick(){
    this.an.getFloatTimeDomainData(this.buf);
    this.analyse(this.buf, performance.now(), Math.round(ctx.sampleRate / 60));
  },
  analyse(x, t, hop){
    if (S.settings.tap) return;
    const N = x.length, sr = ctx.sampleRate;
    let rms = 0; for (let i = N - 1024; i < N; i++) rms += x[i] * x[i];
    rms = Math.sqrt(rms / 1024);                                    // newest ~21 ms
    const sens = S.settings.sens;                                   // 1 (strict) .. 10 (picks up quiet plucks)
    const gate = Math.max(0.01 * Math.pow(10, (5 - sens) / 4), this.floor * 4);
    const muted = t < this.muteUntil;
    // pluck detector, scanning only audio that arrived since the last frame
    if (!muted){
      const k = Math.exp(-1 / (0.012 * sr)), env = this.env || (this.env = new Float32Array(N));
      let v = 0; for (let i = 0; i < N; i++){ const a = Math.abs(x[i]); v = a > v ? a : v * k; env[i] = v; }
      const w = Math.round(0.005 * sr), look = Math.round(0.02 * sr);
      const from = Math.max(Math.round(0.015 * sr), N - hop - 2 * w - look - 32);
      for (let i = from; i + 2 * w + look < N; i += 32){
        // compare with the loudest point of the previous 20 ms, so a low string's per-cycle pulses aren't read as plucks
        let before = env[i]; for (let j = Math.max(0, i - look); j < i; j += 16) before = Math.max(before, env[j]);
        if (env[i + w] > gate * 2 && env[i + w] > (before > gate * 2 ? 1.6 : 3) * before){   // from quiet, or a new pluck over a ringing string
          // rise time: from where the level starts climbing, how close to its peak is it 5 ms later?
          let o = i; while (o < i + w && env[o + 1] <= env[i] * 1.2) o++;
          let hi = 0; for (let j = o; j <= o + w; j += 8) hi = Math.max(hi, env[j]);      // loudest point in the first 5 ms
          let peak = hi; for (let j = o; j < o + w + look; j += 16) peak = Math.max(peak, env[j]);
          // plucks reach 0.6–1.0 of their peak in 5 ms; voices stay under 0.3
          if (hi >= 0.45 * peak && t - this.attackT > 60){ this.attackT = t; this.attackPeak = rms; this.hist = []; this.cand = null; this.lastEmit = null; }
          break;
        }
      }
    }
    let r = null;
    if (!muted && rms > gate){
      const d = this.dec;
      for (let i = 0, o = N - 2048; i < 1024; i++) d[i] = (x[o + 2 * i] + x[o + 2 * i + 1]) * 0.5;
      r = yin(d, sr / 2, 0.07 + sens * 0.01);
    }
    if (!r && rms < 0.2) this.floor = rms < this.floor ? this.floor * 0.9 + rms * 0.1 : this.floor * 0.995 + rms * 0.005;
    if (r && r.f > 60 && r.f < 900 && t - this.attackT < 2500){
      this.silentSince = 0;
      if (t - this.attackT < 60) this.attackPeak = Math.max(this.attackPeak, rms);
      // octave fold: a low course flipping between its fundamental and 2nd harmonic is still one note
      let m = ftom(r.f);
      const ref = this.hist.length ? this.hist[this.hist.length - 1].m : null;
      if (ref !== null){ const k = Math.round((m - ref) / 12); if (k && Math.abs(m - 12 * k - ref) < 0.4) m -= 12 * k; }
      this.hist.push({ m, c:r.clarity, t });
      while (this.hist.length && t - this.hist[0].t > 65) this.hist.shift();
      const h = this.hist, sorted = h.map(e => e.m).sort((a, b) => a - b);
      const span = h.length ? t - h[0].t : 0;
      const clear = h.length && h.reduce((s, e) => s + e.c, 0) / h.length > 0.92;
      const spread = sorted.length >= 5 ? sorted[sorted.length - 2] - sorted[1] : sorted[sorted.length - 1] - sorted[0];   // ignore one outlier each side once there are enough
      const steady = (clear ? h.length >= 3 && span >= 20 : h.length >= 4 && span >= 30) && spread < 0.3;
      if (!steady){ this.cur = null; this.cand = null; this.emit({ type:'frame', cur:null }); return; }
      // clarity-weighted median
      const byM = [...h].sort((a, b) => a.m - b.m), total = h.reduce((s, e) => s + e.c, 0);
      let acc = 0, med = byM[0].m; for (const e of byM){ acc += e.c; if (acc >= total / 2){ med = e.m; break; } }
      const clarity = total / h.length;
      this.cur = { midi:med, freq:mtof(med), rms };
      let q = Math.round(med / this.grid) * this.grid;
      if (this.cand !== null && Math.abs(med - this.cand) < 0.65 * this.grid) q = this.cand;   // hysteresis
      if (q !== this.cand){ this.cand = q; this.candSince = t; }
      const need = clarity > 0.92 && rms > gate * 3 ? this.stableMs * 0.3 : this.stableMs;
      const fading = t - this.attackT < 60 || rms <= this.attackPeak * 1.25;
      // a new pluck, or a new pitch on a still-sounding string (another course, or a slide on the fretless neck)
      const fresh = this.candSince - this.attackT < 400 || (this.lastEmit !== null && Math.abs(q - this.lastEmit) >= this.grid);
      if (t - this.candSince >= need && fresh && fading
          && (this.lastEmit === null || Math.abs(q - this.lastEmit) >= this.grid)){
        this.lastEmit = q; this.emit({ type:'note', midi:med });
      }
    } else {
      // only real quiet ends a sounding note; an unpitched moment (the pluck itself) does not
      if (rms >= gate) this.silentSince = 0; else if (!this.silentSince) this.silentSince = t;
      if (this.silentSince && t - this.silentSince > 160){ this.hist = []; this.cand = null; this.lastEmit = null; this.cur = null; this.attackT = -1e9; }
    }
    this.emit({ type:'frame', cur:this.cur });
  }
};

/* ---------- curriculum ---------- */
const ex = {
  intro:(title, body) => ({ type:'intro', title, body }),
  tune:(s) => ({ type:'tune', midi:s.m, label:s.label }),
  compare(minGap, maxGap){
    let a, b;
    do { a = 45 + rnd(17); const g = minGap + rnd(maxGap - minGap + 1); b = a + (Math.random() < .5 ? g : -g); } while (b < 43 || b > 66);
    return { type:'compare', notes:[a, b], answer: a > b ? 'first' : 'second' };
  },
  same(){
    const a = pick(SCALE), diff = Math.random() < .5;
    const b = diff ? a + pick([-2, -1, 1, 2]) : a;
    return { type:'same', notes:[a, b], answer: diff ? 'different' : 'same' };
  },
  direction(minStep, maxStep, pool = SCALE){
    const n = seq(2, minStep, maxStep, pool);
    return { type:'direction', notes:n, answer: n[1] > n[0] ? 'up' : 'down' };
  },
  directionN:(n) => ({ type:'direction', notes:n, answer: n[1] > n[0] ? 'up' : 'down' }),
  contourN(n){ const d = (a, b) => b > a ? 'up' : 'down'; return { type:'contour', notes:n, answer:`${d(n[0], n[1])}-${d(n[1], n[2])}` }; },
  contour(minStep, maxStep, pool = SCALE){
    const n = seq(3, minStep, maxStep, pool);
    const d = (a, b) => b > a ? 'up' : 'down';
    return { type:'contour', notes:n, answer:`${d(n[0], n[1])}-${d(n[1], n[2])}` };
  },
  name(pool){
    const m = pick(pool.filter(x => x !== 48));
    const others = shuffle(pool.filter(x => x !== m && x !== 48)).slice(0, 2);
    return { type:'name', ref:48, midi:m, choices:shuffle([m, ...others]), answer:m };
  },
  echo(notes, opts = {}){ return { type:'echo', notes, dur:opts.dur || 0.9, replays:opts.replays ?? Infinity, slow:opts.slow !== false }; },
  scale:(notes) => ({ type:'scale', notes }),
  /* the maqam's first jins, or the foil jins it is easily confused with, played up and back down */
  jins(mq){
    const real = Math.random() < .5, j = real ? mq.scale.slice(0, mq.jins) : mq.foil.notes;
    return { type:'jins', notes:[...j, ...j.slice(0, -1).reverse()], answer: real ? 'real' : 'foil' };
  },
  /* the signature note against its foil: same or different? */
  sig(mq){
    const [a, b] = mq.sig, pair = pick([[a, b], [b, a], [a, b], [a, a], [b, b]]);
    return { type:'same', notes:pair, answer: pair[0] === pair[1] ? 'same' : 'different' };
  },
};
/* a phrase that ends on the tonic (a qafla): walk away from the tonic, then reverse it */
function qafla(len, pool){
  let i = 0; const out = [pool[0]];
  while (out.length < len){ let j; do { j = i + pick([1, 1, 2, -1]); } while (j < 1 || j >= pool.length || j === i); i = j; out.push(pool[i]); }
  return out.reverse();
}
/* sequence on the scale; steps measured in scale degrees, never repeating a note back to back */
function seq(len, minStep = 1, maxStep = 1, pool = SCALE){
  let i = rnd(pool.length); const out = [pool[i]];
  while (out.length < len){
    let j;
    do { const s = minStep + rnd(maxStep - minStep + 1); j = i + (Math.random() < .5 ? s : -s); } while (j < 0 || j >= pool.length);
    i = j; out.push(pool[i]);
  }
  return out;
}
const times = (n, fn) => Array.from({ length:n }, fn);

/* ---------- taqsim phrases ----------
   Short phrases that follow each maqam's sayr (its traditional melodic path): the core moves on the
   first jins, the climb to the ghammaz (the second "home"), the upper jins, and the typical descents and
   qaflas, including the notes a taqsim borrows on the way down (Rast's B♭, Nahawand's B and B♭, the
   note under the tonic). Exercises draw their notes from these phrases, without saying so.
   midi: 48 = C3, .5 = quarter tone. */
const MOTIFS = {
  ajam:     [[48,50,52,53,55], [55,53,52,50,48], [48,52,55,52,48], [52,53,55,57,55], [60,59,57,55], [55,57,59,60], [53,52,50,48], [50,52,53,52,50,48]],
  rast:     [[48,53,51.5,50,48], [48,50,51.5,53,55], [55,53,51.5,50,48], [51.5,53,55,53,51.5,50,48], [55,57,58.5,60,58.5,57,55],
             [60,58,57,55,53,51.5,50,48], [50,51.5,50,48,46.5,48], [57,55,53,51.5,53,50,48]],
  bayati:   [[50,51.5,53,55,53,51.5,50], [55,53,51.5,50], [53,55,57,55,53,51.5,50], [55,57,58,60,58,57,55],
             [62,60,58,57,55,53,51.5,50], [51.5,53,51.5,50,48,50], [50,53,51.5,55,53,51.5,50]],
  hijaz:    [[50,51,54,55,54,51,50], [55,54,51,50], [54,55,57,58,57,55,54,51,50], [55,57,58,60,58,57,55],
             [62,60,58,57,55,54,51,50], [51,50,48,50], [50,54,51,55,54,51,50]],
  nahawand: [[48,50,51,53,55,53,51,50,48], [55,56,59,60,59,56,55], [60,58,56,55,53,51,50,48], [51,50,48,47,48],
             [53,55,56,55,53,51,50], [48,51,50,53,51,55], [55,53,51,50,48]],
  kurd:     [[50,51,53,55,53,51,50], [55,57,58,60,58,57,55], [58,57,55,53,51,50], [53,51,50,48,50],
             [62,60,58,57,55,53,51,50], [51,53,51,50], [50,53,51,55,53,51,50]],
  saba:     [[50,51.5,53,54,53,51.5,50], [53,54,57,58,57,54,53], [54,53,51.5,50], [53,51.5,50,48,50],
             [58,57,54,53,51.5,50], [51.5,53,54,53,51.5,53,51.5,50]],
  sikah:    [[51.5,53,55,53,51.5], [55,57,58.5,60,58.5,57,55], [55,53,51.5,50,48,50,51.5], [53,51.5,50,51.5],
             [60,58.5,57,55,53,51.5], [51.5,55,53,51.5]],
};
/* a window of `len` notes from the phrases, optionally filtered; null if none fits */
function taqsim(key, len, ok){
  ok = ok || (() => true);
  const pool = [];
  for (const m of MOTIFS[key]) for (let s = 0; s + len <= m.length; s++){ const w = m.slice(s, s + len); if (ok(w)) pool.push(w); }
  return pool.length ? pick(pool) : null;
}
const phrase = (key, len, ok, fallback) => (Math.random() < 0.85 && taqsim(key, len, ok)) || fallback();
const stepPair = w => Math.abs(w[1] - w[0]) <= 2, skipPair = w => Math.abs(w[1] - w[0]) >= 3;
/* single notes, one per exercise, walking through a phrase in order */
const phraseNotes = (key, n, ok) => (taqsim(key, n, ok) || shuffle(SCALE).slice(0, n)).map(m => ex.echo([m]));

const LEVEL1 = { id:1, key:'L1', title:'One note', desc:'Hear one note, find it on your oud. All in Ajam (the major scale) on C.', c:'--primary', lessons:[
    { id:'1-1', title:'Tune your oud', gen:() => [

      ...oudStrings().map(ex.tune) ] },

/* ---------- maqamat: each one is its own route through Levels 2 and 3 ----------

  { id:'kurd', name:'Kurd', ar:'كرد', c:'--sky', tonic:'D', scale:[50,51,53,55,57,58,60,62], jins:4, gh:3,
    foil:{ name:'Bayati', ar:'بياتي', notes:[50,51.5,53,55] }, sig:[51,51.5],

    foil:{ name:'Busalik', ar:'بوسليك', notes:[52,53,55] }, sig:[51.5,52],

const MAQ = Object.fromEntries(MAQAMAT.map(m => [m.id, m]));
function setCtx(mqId){ const mq = mqId && MAQ[mqId]; GRID = mq ? 0.5 : 1; SPELL = (mq && mq.spell) || {}; Mic.grid = GRID; }
/* every note a maqam's exercises can ask for (scale, foil, and the notes its phrases borrow) */
const maqamNotes = mq => [...new Set([...mq.scale, ...mq.foil.notes, ...mq.sig, ...MOTIFS[mq.id].flat()])].sort((a, b) => a - b);

/* 5 lessons per level, 6 graded exercises each = 30 per level, then a mastery test */
function route(mq){
  const sc = mq.scale, jn = sc.slice(0, mq.jins), tonic = sc[0], gh = sc[mq.gh], k = mq.id;
  const inJins = w => w.every(m => jn.includes(m));
  const pair = ok => ex.echo(phrase(k, 2, ok, () => seq(2, 1, ok === skipPair ? 3 : 1, sc)));
  const three = (ok, dur) => ex.echo(phrase(k, 3, ok, () => seq(3, 1, 2, ok ? jn : sc)), { dur });
  const endsHome = w => w[w.length - 1] === tonic;
  const two = [
    { title:`Meet ${mq.name}`, gen:() => [
      ex.intro(`Maqam ${mq.name} · ${mq.ar}`, `<p>${mq.about}</p><p>Listen to the scale first. Every exercise on this route stays inside ${mq.name}.</p>`),
      ex.scale(sc), ...times(2, () => ex.jins(mq)), ...(taqsim(k, 4, inJins) || shuffle(jn)).slice(0, 4).map(m => ex.echo([m])) ] },
    { title:'The signature note', gen:() => [
      ex.intro(`What makes it ${mq.name}`, `<p>${mq.sigText}</p>`),
      ...times(3, () => ex.sig(mq)), ex.echo(jn, { dur:0.8 }), ...times(2, () => pair(w => stepPair(w) && inJins(w))) ] },
    { title:'Steps', gen:() => [ ex.directionN(phrase(k, 2, stepPair, () => seq(2, 1, 1, sc))), ...times(5, () => pair(stepPair)) ] },
    { title:'Skips', gen:() => [ ex.jins(mq), ...times(4, () => pair(skipPair)), ex.sig(mq) ] },
    { title:'The ghammaz', gen:() => [
      ex.intro('The second home', `<p>Every maqam has a second resting note, the <b>ghammaz</b>. In ${mq.name} it is <b>${name(gh)}</b>. Phrases climb to it, rest there, and come back to ${mq.tonic}.</p>`),
      ex.echo([tonic, gh]), ex.echo([gh, tonic]), ...times(4, () => pair(w => w.includes(gh) || w.includes(tonic))) ] },
  ];
  const threeL = [
    { title:'Inside the first jins', gen:() => [
      ex.intro('Jins: the building block', `<p>A maqam is built from small groups of 3 to 5 notes called <b>ajnas</b> (one is a <b>jins</b>). The first jins sets the mood.</p><p>Hum each phrase once before you play it.</p>`),
      ex.contourN(phrase(k, 3, inJins, () => seq(3, 1, 1, jn))), ...times(5, () => three(inJins, 0.75)) ] },
    { title:'Across the scale', gen:() => [ ex.contourN(phrase(k, 3, null, () => seq(3, 1, 2, sc))), ...times(5, () => three(null, 0.7)) ] },
    { title:'Four notes', gen:() => times(6, () => ex.echo(phrase(k, 4, null, () => seq(4, 1, 2, sc)), { dur:0.6 })) },
    { title:'Qafla: back home', gen:() => [

function addTest(level){
  level.test = { id:`${level.key}-test`, title:'Mastery test', test:true, mq:level.mq,
    gen:() => {
      const per = level.lessons.filter(l => l.id !== '1-1').map(l => shuffle(l.gen().filter(e => !['intro', 'scale', 'tune'].includes(e.type))));
      const out = []; for (let r = 0; out.length < 12 && r < 6; r++) for (const p of per) if (p[r] && out.length < 12) out.push(p[r]);
      return shuffle(out).map(e => ({ ...e, test:true }));

}

/* ---------- mic check: quiet room → pluck → talk ---------- */
async function micCheck(done){
  showAuth(`<h2 style="font-size:28px">Mic check</h2>
    <div class="cal-step" id="c1"><span class="qi" style="--c:var(--sky)">1</span><span>Stay quiet for 2 seconds</span></div>
    <div class="cal-step" id="c2"><span class="qi" style="--c:var(--sky)">2</span><span>Pluck any open string and let it ring</span></div>
    <div class="cal-step" id="c3"><span class="qi" style="--c:var(--sky)">3</span><span>Say a sentence out loud</span></div>
    <div class="cal-meter"><i id="calLvl"></i></div>
    <p class="hint" id="calMsg" aria-live="polite">Starting microphone…</p>
    <button class="btn ghost wide" id="calSkip">Skip</button>`);
  let stop = false;
  $('#calSkip').onclick = () => { stop = true; done(); };
  S.settings.tap = false;
  if (!await Mic.start()){ $('#calMsg').textContent = 'The microphone is blocked. Allow it in your browser settings, or skip and use on-screen keys.'; return; }
  const lvl = () => {   // level of the newest ~21 ms, from whichever capture mode is running
    let b = Mic.ring; if (Mic.mode === 'frames'){ Mic.an.getFloatTimeDomainData(Mic.buf); b = Mic.buf; }
    let r = 0; for (let i = b.length - 1024; i < b.length; i++) r += b[i] * b[i]; return Math.sqrt(r / 1024);
  };
  const meter = r => { const el = $('#calLvl'); if (el) el.style.width = `${Math.min(100, r * 400)}%`; };
  const mark = id => { const el = $(id); if (el){ el.classList.add('done'); el.querySelector('.qi').innerHTML = icon('i-check'); } };
  // 1. room noise
  $('#calMsg').textContent = 'Listening to your room…';
  let sum = 0, n = 0; const t0 = performance.now();
  while (performance.now() - t0 < 2000){ if (stop) return; const r = lvl(); sum += r; n++; meter(r); await sleep(30); }
  Mic.floor = sum / n; mark('#c1');
  // 2. pluck: start strict, loosen until the pluck is heard
  let heard = null;
  for (let sens = 4; sens <= 9 && !heard && !stop; sens++){
    S.settings.sens = sens;
    $('#calMsg').textContent = sens === 4 ? 'Now pluck any open string.' : 'Didn\'t catch that. Pluck again, a little firmer.';
    heard = await new Promise(res => {
      const off = Mic.on(e => { if (e.type === 'note'){ off(); clearInterval(iv); res(e.midi); } });
      const iv = setInterval(() => meter(Mic.cur ? Mic.cur.rms : 0), 60);
      setTimeout(() => { off(); clearInterval(iv); res(null); }, 5000);
    });
  }
  if (stop) return;
  if (!heard){ S.settings.sens = 7; $('#calMsg').textContent = 'Couldn\'t hear the oud clearly. Try moving it closer to the microphone. You can rerun this from your profile.'; save(); $('#calSkip').textContent = 'Continue'; return; }
  mark('#c2');
  // 3. speech must not register; tighten if it does
  $('#calMsg').textContent = `Heard ${name(heard)}. Now say something out loud for 3 seconds.`;
  let falses = 0;
  const off = Mic.on(e => { if (e.type === 'note') falses++; });
  await sleep(3500); off();
  if (falses && S.settings.sens > 3) S.settings.sens--;
  mark('#c3'); save();
  $('#calMsg').textContent = falses ? `Your voice was picked up, so the filter is now stricter (sensitivity ${S.settings.sens}).` : `All set. Samaa hears your oud and ignores your voice (sensitivity ${S.settings.sens}).`;
  $('#calSkip').className = 'btn wide'; $('#calSkip').textContent = 'Done';
  $('#calSkip').onclick = done;
}

let L = null;
function startLesson(id, practice = false){
  let ls, queue;
  if (id === 'tricky'){
    queue = shuffle(tricky().flatMap(t => [ex.echo([t.m]), ex.echo([t.m])].map(e => ({ ...e, mq:t.mq || undefined }))));
    ls = { id:'tricky', title:'Tricky notes', level:{ c:'--coral' } };
  } else if (practice){
    const pool = ALL.filter(x => isDone(x.id) && x.id !== '1-1' && !x.test);
    const src = pool.length ? pool : [ALL[1]];
    queue = shuffle(src.flatMap(x => x.gen()).filter(e => e.type !== 'intro' && e.type !== 'scale')).slice(0, 8);
    ls = { id:'practice', title:'Practice', level:{ c:'--sky' } };
  } else {
    ls = ALL.find(x => x.id === id);
    queue = ls.gen();
  }
  L = { ls, practice, queue, idx:0, total:queue.filter(e => e.type !== 'intro' && e.type !== 'scale').length, done:0, wrong:0, answered:0, t0:Date.now(), cleanup:null, slips:0, firstOk:0 };
  $('#lesson').hidden = false; document.body.style.overflow = 'hidden';
  renderEx();
}
function endLesson(){
  if (L?.cleanup) L.cleanup();
  L = null; $('#lesson').hidden = true; document.body.style.overflow = ''; go(tab);
}
$('#quit').onclick = () => {
  openModal(`<h3>Leave this lesson?</h3><p>You will lose the progress you made in it.</p>
    <div class="row"><button class="btn" onclick="closeModal()">Keep learning</button><button class="btn ghost" id="leave">Leave</button></div>`);

};
function setProgress(){
  $('#bar').style.width = `${(L.done / Math.max(1, L.total)) * 100}%`;
}
function footer(html, mode = ''){
  $('#lfoot').className = `lfoot ${mode}`;
  $('#lfootIn').innerHTML = html;
}
function renderEx(){
  if (L.cleanup){ L.cleanup(); L.cleanup = null; }
  if (L.idx >= L.queue.length) return complete();
  const e = L.queue[L.idx];
  setCtx(e.mq);
  L.curSlip = false;
  setProgress();
  $('#lbody').className = 'wrap center';
  ({ intro:exIntro, scale:exScale, jins:exChoice, tune:exTune, echo:exEcho, compare:exChoice, same:exChoice, direction:exChoice, contour:exChoice, name:exChoice })[e.type](e, $('#lbody'));
  $('.lbody').scrollTop = 0;
}
const PRAISE = ['Ahsant! أحسنت', 'Nice ear!', 'Spot on!', 'Tarab! طرب', 'Exactly right', 'Beautiful'];
function verdict(ok, detail, replay){
  if (L.cleanup){ L.cleanup(); L.cleanup = null; }
  const e = L.queue[L.idx];
  sfx(ok);
  L.answered++;
  if (ok){
    if (!e.retry && !L.curSlip) L.firstOk++;   // mastery counts first-try answers only
    L.done++; L.combo = (L.combo || 0) + 1;
    const q = today(); q.combo = Math.max(q.combo, L.combo);
    if (L.combo === 5) checkQuests();
  }
  else {
    L.wrong++; L.combo = 0;
    if (e.type !== 'tune') L.queue.push({ ...e, retry:true });   // missed exercises come back at the end
  }
  setProgress();
  footer(`<div class="verdict"><span class="badge">${icon(ok ? 'i-check' : 'i-x')}</span>
      <div><h3>${ok ? pick(PRAISE) : 'Not quite'}${ok && L.combo >= 3 ? `<span class="combo">${L.combo} in a row</span>` : ''}</h3>${detail ? `<p>${detail}</p>` : ''}</div></div>
      ${replay ? `<button class="link" id="replayAns">Hear it again</button>` : ''}
      <button class="btn ${ok ? '' : 'bad'}" id="next">Continue</button>`, ok ? 'ok' : 'bad');
  if (replay) $('#replayAns').onclick = replay;
  $('#next').focus();
  $('#next').onclick = () => {
    L.idx++; renderEx();
  };
}
function skipEx(){
  if (L.cleanup){ L.cleanup(); L.cleanup = null; }
  L.done++; L.idx++; renderEx();
}
function complete(){
  const secs = Math.round((Date.now() - L.t0) / 1000);
  const acc = L.answered ? Math.round(100 * (L.answered - L.wrong - L.slips) / L.answered) : 100;
  const again = !L.practice && isDone(L.ls.id), perfect = L.wrong === 0 && L.slips === 0, mult = xpMult();
  const rate = L.total ? L.firstOk / L.total : 1, need = L.ls.test ? 0.9 : 0.8;
  const passed = L.practice || L.ls.id === '1-1' || rate >= need;
  const newlyMastered = L.ls.test && passed && !again;
  const xp = (L.practice || again || !passed ? 5 : L.ls.test ? 30 : 10 + (perfect ? 5 : 0)) * mult;
  const pearls = L.practice ? 5 : 10 + (perfect ? 5 : 0);
  S.xp += xp; S.pearls += pearls; S.lessons = (S.lessons || 0) + 1;
  if (perfect && !L.practice) S.perfects++;
  const day = dayKey(); S.daily[day] = (S.daily[day] || 0) + xp;
  const q = today(); q.xp += xp; q.lessons++;
  const y = new Date(); y.setDate(y.getDate() - 1);
  let extended = false;
  if (S.lastDay !== day){
    S.streak = S.lastDay === dayKey(y) ? S.streak + 1 : 1; S.lastDay = day; extended = true;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    if (S.streak % 7 === 0){ S.pearls += 25; setTimeout(() => toast(`${S.streak}-day streak bonus`, '+25'), 900); }
  }

    <p>${!passed ? `${firstTry}. You need ${need * 100}% to pass${L.ls.test ? ' the mastery test' : ''}. Each try trains your ear.`
      : L.practice ? 'Your ear is staying sharp.' : L.ls.test ? `${firstTry}. You've truly got this level.` : perfect ? 'A perfect lesson. Your ear is waking up.' : `${firstTry}. Your ear gets sharper every time.`}</p>
    <div class="result-tiles">
