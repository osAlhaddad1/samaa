/* wires the panel; onNote(midi) gets stable notes, onFrame(cur) every frame */
function wireInput(rerender, onNote, onFrame){
  const offs = [];
  if (S.settings.tap){
    $('#useMic').onclick = () => { S.settings.tap = false; save(); rerender(); };
    document.querySelectorAll('.listen [data-m]').forEach(b => b.onclick = async () => {
      const m = +b.dataset.m; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 180);
      await ensureCtx(); playNote(m, ctx.currentTime + 0.01, 0.6); onNote(m, true);
    });
  } else {
    $('#useKeys').onclick = () => { S.settings.tap = true; save(); rerender(); };
    Mic.start().then(ok => {
      if (!$('#micTxt')) return;
      if (!ok){
        $('#micTxt').textContent = 'Microphone blocked';
        $('#heard').innerHTML = `<span>Allow microphone access in your browser, or switch to on-screen keys.</span>`;
        return;
      }
      $('#dot').classList.add('on'); $('#micTxt').textContent = 'Listening';
    });
    offs.push(Mic.on(ev => {
      if (ev.type === 'note') onNote(ev.midi, false);
      else { onFrame && onFrame(ev.cur); const h = $('#heard'); if (h && ev.cur) h.innerHTML = `<b>${name(ev.cur.midi)}</b><span>${sub(ev.cur.midi)} · ${ev.cur.freq.toFixed(1)} Hz</span>`; }
    }));
  }
  return () => offs.forEach(f => f());
}

/* ----- exercise: echo (hear, then play it back) ----- */
function exEcho(e, body){
  const n = e.notes.length;
  // No failing here: wrong notes only steer you (higher / lower) until you find the right one.
  let slot = 0, slotMiss = 0, mistakes = 0, replaysLeft = e.replays, finished = false, hinted = false, revealed = false;
  Mic.stableMs = e.dur < 0.6 ? 110 : 150;
  const render = () => {
    if (L.cleanup){ L.cleanup(); L.cleanup = null; }
    body.innerHTML = `<div class="ex-grid"><div class="ex-main">
      <h2 class="ex-title">${n === 1 ? 'Play the note you hear' : `Play these ${n} notes back`}</h2>
      ${e.retry ? `<p class="ex-sub">One more try at this one.</p>` : e.mq && S.settings.tonic ? `<p class="ex-sub">You'll hear the tonic, ${name(MAQ[e.mq].scale[0])}, first.</p>` : ''}
      <div class="listen-row">
        <button class="speak" id="play" aria-label="Play again">${icon('i-speaker')}</button>
        ${e.slow && n > 1 ? `<button class="speak small" id="slow" aria-label="Play slowly">${icon('i-slow')}</button>` : ''}
      </div>
      <p class="replays" id="rep"></p>
      <div class="slots">${e.notes.map((m, i) => `<div class="slot ${i < slot ? 'ok' : i === slot ? 'active' : ''}" data-i="${i}">${i < slot ? name(m) : '?'}</div>`).join('')}</div>
      <p class="hint" id="hint" aria-live="polite"></p>
      </div><div class="ex-side">${inputPanel()}</div></div>`;
    footer(`<button class="btn ghost" id="skip">Can't play now</button><button class="link" id="reveal" ${mistakes >= 3 && !revealed && !e.test ? '' : 'hidden'}>Show me the note</button>`);
    $('#skip').onclick = skipEx;
    $('#reveal').onclick = reveal;
    showReplays();
    $('#play').onclick = () => listen(e.dur, true);
    if ($('#slow')) $('#slow').onclick = () => listen(e.dur * 1.8, true);
    if (hinted) $('#meterBox') && ($('#meterBox').hidden = false);
    L.cleanup = wireInput(render, onNote, onFrame);
  };
  const showReplays = () => {
    const r = $('#rep'); if (!r) return;
    if (replaysLeft === Infinity) r.textContent = n > 1 ? 'Tap to hear it again, or slower' : 'Tap to hear it again';
    else r.textContent = replaysLeft > 0 ? `${replaysLeft} replay left` : 'No replays left';
    const dis = replaysLeft <= 0;
    $('#play').disabled = dis; if ($('#slow')) $('#slow').disabled = dis;
  };
  const listen = async (dur, isReplay) => {
    if (isReplay){ if (replaysLeft <= 0) return; if (replaysLeft !== Infinity) replaysLeft--; }
    $('#play')?.classList.add('playing');
    if (e.mq && S.settings.tonic){ await playSeq([MAQ[e.mq].scale[0]], 0.8); await sleep(150); }   // home note first, so quarter tones sit in context
    await playSeq(e.notes, dur);
    $('#play')?.classList.remove('playing');
    showReplays();
  };
  const reveal = () => {
    revealed = true; $('#reveal').hidden = true;
    const t = e.notes[slot];
    $('#hint').className = 'hint'; $('#hint').textContent = `The note is ${name(t)} (${sub(t)}). Find it, then play it.`;
    playSeq([t], 1.2);
  };
  // live steering once you've missed: the marker and the arrow follow whatever you're playing
  const onFrame = cur => {
    if (!hinted || finished) return;
    const mk = $('#mark'), dir = $('#liveDir'); if (!mk || !cur) return;
    const raw = fold(cur.midi - e.notes[slot]), d = Math.max(-6, Math.min(6, raw));
    mk.style.left = `${50 + d / 6 * 50}%`;
    if (dir) dir.textContent = Math.abs(raw) < GRID / 2 ? 'Right there, hold it…' : raw > 0 ? 'Too high: go lower ↓' : 'Too low: go higher ↑';
  };
  const onNote = (m) => {
    if (finished) return;
    const target = e.notes[slot];
    const d = fold(m - target);
    const slotEl = document.querySelector(`.slot[data-i="${slot}"]`);
    if (Math.abs(d) < GRID / 2){          // within 50 cents (Level 1) or 25 cents (maqam routes)
      slotEl.className = 'slot ok'; slotEl.textContent = name(target);
      earRecord(target, e.mq, !slotMiss); slotMiss = 0;
      slot++;
      $('#hint').className = 'hint'; $('#hint').textContent = slot < n ? `Yes, ${name(target)}. Next note…` : '';
      const nx = document.querySelector(`.slot[data-i="${slot}"]`); if (nx) nx.classList.add('active');
      if (slot === n){
        finished = true;
        if (mistakes){ L.slips++; L.combo = 0; L.curSlip = true; }   // found it, but not first try: no "in a row" credit
        const what = n > 1 ? e.notes.map(name).join(' – ') : `That was ${name(target)} (${sub(target)})`;
        verdict(true, mistakes ? `${what}. Found it after ${mistakes + 1} tries.` : what);
      }
      return;
    }
    mistakes++; slotMiss++;
    hinted = true; $('#meterBox') && ($('#meterBox').hidden = false);
    slotEl.classList.remove('shake'); void slotEl.offsetWidth; slotEl.classList.add('shake');
    const dir = d > 0 ? 'lower ↓' : 'higher ↑';
    $('#hint').className = 'hint bad';
    const gap = Math.max(GRID, Math.round(Math.abs(d) / GRID) * GRID);
    $('#hint').textContent = `You played ${name(m)}. That's ${gapText(gap)} too ${d > 0 ? 'high' : 'low'}. Go ${dir}`;
    if (mistakes >= 3 && !revealed && !e.test) $('#reveal').hidden = false;
  };
  render();
  setTimeout(() => { if (L && L.queue[L.idx] === e) listen(e.dur, false); }, 350);
}

/* ----- exercise: tune one string ----- */
function exTune(e, body){
  let held = 0, last = 0, finished = false;
  const render = () => {
    if (L.cleanup){ L.cleanup(); L.cleanup = null; }
    body.innerHTML = `<div class="ex-grid"><div class="ex-main">
      <h2 class="ex-title">Tune your ${name(e.midi)} string</h2>
      <p class="ex-sub">${e.label} course · ${name(e.midi)}${oct(e.midi)} · ${sub(e.midi)} · ${mtof(e.midi).toFixed(1)} Hz</p>
      ${S.settings.tap ? '' : `${gaugeSvg()}<div class="hold" aria-label="Hold steady"><i id="hold"></i></div>`}
      <p class="hint" id="hint">${S.settings.tap ? `Tap ${name(e.midi)} on the keys below.` : 'Pluck the string and hold it in the green zone.'}</p>
      </div><div class="ex-side stack" style="gap:12px">
      <div style="display:flex;justify-content:center"><button class="btn ghost" id="ref">${icon('i-speaker')} Hear ${name(e.midi)}</button></div>
      ${inputPanel()}</div></div>`;
    footer(`<button class="btn ghost" id="skip">Skip this string</button><span></span>`);
    $('#skip').onclick = skipEx;
    $('#ref').onclick = () => playSeq([e.midi], 1.2);
    L.cleanup = wireInput(render, onNote, onFrame);
  };
  const onNote = (m, tap) => { if (tap && pc(m) === pc(e.midi) && !finished){ finished = true; verdict(true, `${name(e.midi)} string ready`); } };
  const onFrame = cur => {
    if (finished) return;
    const t = performance.now(), dt = last ? t - last : 0; last = t;
    if (!cur){ setNeedle(null); held = Math.max(0, held - dt); return paintHold(); }
    const cents = fold(cur.midi - e.midi) * 100;
    setNeedle(cents);
    const h = $('#hint');
    if (Math.abs(cents) <= 15){ held += dt; h.className = 'hint'; h.textContent = 'In tune. Hold it…'; }
    else {
      held = Math.max(0, held - dt);
      if (Math.abs(cents) > 60){ h.className = 'hint bad'; h.textContent = `That's ${name(cur.midi)}. Make sure you're plucking the ${name(e.midi)} string.`; }
      else { h.className = 'hint'; h.textContent = cents > 0 ? `${Math.round(cents)} cents sharp: loosen the peg a little ↓` : `${Math.round(-cents)} cents flat: tighten the peg a little ↑`; }
    }
    paintHold();
    if (held >= 600){ finished = true; verdict(true, `${name(e.midi)} string is in tune`); }
  };
  const paintHold = () => { const el = $('#hold'); if (el) el.style.width = `${Math.min(100, held / 6)}%`; };
  render();
}
function gaugeSvg(){
  const ticks = [];
  for (let c = -50; c <= 50; c += 10){
    const a = (c / 50) * 60 * Math.PI / 180, r1 = 86, r2 = c % 50 === 0 || c === 0 ? 70 : 76;
    ticks.push(`<line x1="${100 + r1*Math.sin(a)}" y1="${105 - r1*Math.cos(a)}" x2="${100 + r2*Math.sin(a)}" y2="${105 - r2*Math.cos(a)}" stroke="var(--muted)" stroke-width="${c === 0 ? 3 : 2}" stroke-linecap="round"/>`);
  }
  return `<svg class="gauge" viewBox="0 0 200 122" role="img" aria-label="Tuning needle">
    <path d="M${100 - 86*Math.sin(Math.PI/3)} ${105 - 86*Math.cos(Math.PI/3)} A86 86 0 0 1 ${100 + 86*Math.sin(Math.PI/3)} ${105 - 86*Math.cos(Math.PI/3)}" fill="none" stroke="var(--lock)" stroke-width="14" stroke-linecap="round"/>
    <path d="M${100 - 86*Math.sin(Math.PI/20)} ${105 - 86*Math.cos(Math.PI/20)} A86 86 0 0 1 ${100 + 86*Math.sin(Math.PI/20)} ${105 - 86*Math.cos(Math.PI/20)}" fill="none" stroke="var(--primary)" stroke-width="14"/>
    ${ticks.join('')}
    <text x="22" y="120" font-size="11" font-weight="800" fill="var(--muted)" font-family="Nunito,sans-serif">FLAT</text>
    <text x="150" y="120" font-size="11" font-weight="800" fill="var(--muted)" font-family="Nunito,sans-serif">SHARP</text>
    <g class="needle" id="needle" style="transform-origin:100px 105px;transform:rotate(0deg);opacity:.25">
      <line x1="100" y1="105" x2="100" y2="28" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    </g><circle cx="100" cy="105" r="8" fill="var(--ink)"/></svg>`;
}
let needleS = null;
function setNeedle(cents){
  const n = $('#needle'); if (!n) return;
  if (cents == null){ n.style.opacity = .25; needleS = null; return; }
  needleS = needleS == null ? cents : needleS * 0.6 + cents * 0.4;   // smoothed, so the needle doesn't jitter
  const c = Math.max(-50, Math.min(50, needleS));
  n.style.opacity = 1; n.style.transform = `rotate(${c / 50 * 60}deg)`;
  n.querySelector('line').setAttribute('stroke', Math.abs(needleS) <= 15 ? 'var(--primary)' : 'var(--ink)');
}

/* ----- exercise: listening choices ----- */
const CHOICE = {
  compare:   e => ({ title:'Which note was higher?', opts:[['first','First note'],['second','Second note']], play:d => playSeq(e.notes, d || 1) }),
  same:      e => ({ title:'Same note, or different?', opts:[['same','Same'],['different','Different']], play:d => playSeq(e.notes, d || 1) }),
  direction: e => ({ title:'Did it go up or down?', opts:[['up','Up ↗'],['down','Down ↘']], play:d => playSeq(e.notes, d || 0.9) }),
  contour:   e => ({ title:'Which shape did you hear?', opts:[['up-up','↗ ↗','up, up'],['up-down','↗ ↘','up, down'],['down-up','↘ ↗','down, up'],['down-down','↘ ↘','down, down']], play:d => playSeq(e.notes, d || 0.75) }),
  name:      e => ({ title:'Here is Do. What comes next?', opts:e.choices.map(m => [m, name(m), sub(m)]), play:d => playSeq([e.ref, e.midi], d || 1) }),
  jins:      e => { const mq = MAQ[e.mq]; return { title:`Is this ${mq.name} or ${mq.foil.name}?`,
    opts:[['real', mq.name, mq.ar], ['foil', mq.foil.name, mq.foil.ar]], play:d => playSeq(e.notes, d || 0.5) }; },
};
/* ----- listening card: the maqam's scale, lit note by note ----- */
function exScale(e, body){

  body.innerHTML = `<div class="ex-grid"><div class="ex-main">

    </div></div>`;
  document.querySelectorAll('.str').forEach(b => b.onclick = () => playSeq([OUD[b.dataset.i].m], 1.4));
  document.querySelectorAll('#tun button').forEach(b => b.onclick = () => { S.settings.tuning = b.dataset.v; save(); go('tuner'); });
  let off = null;
  const begin = async () => {
    if (S.settings.tap){ S.settings.tap = false; save(); }
    const ok = await Mic.start();
    if (!ok){ $('#th').textContent = 'Microphone blocked. Allow access in your browser settings and try again.'; return; }
    $('#startMic').hidden = true;
    off = Mic.on(ev => {
      if (ev.type !== 'frame' || !$('#bn')) return;
      const cur = ev.cur;
      document.querySelectorAll('.str').forEach(b => b.classList.remove('near'));
      if (!cur){ setNeedle(null); return; }
      const r = Math.round(cur.midi), cents = (cur.midi - r) * 100;
      $('#bn').innerHTML = `<b>${name(r)}<sub style="font-size:28px">${oct(r)}</sub></b><p class="ar">${ARN[pc(r) * 2]} · ${ARL[pc(r) * 2]}</p><p>${sub(r).split(' · ')[0]} · ${cur.freq.toFixed(1)} Hz · ${cents >= 0 ? '+' : ''}${Math.round(cents)} cents</p>`;
      setNeedle(cents);
      let best = 0; OUD.forEach((s, i) => { if (Math.abs(cur.midi - s.m) < Math.abs(cur.midi - OUD[best].m)) best = i; });
      if (Math.abs(cur.midi - OUD[best].m) < 1.5) document.querySelector(`.str[data-i="${best}"]`).classList.add('near');
      const q = ((Math.round(cur.midi * 2) % 24) + 24) % 24;
      $('#th').textContent = Math.abs(cents) >= 35 && WEST[q] && q % 2
        ? `Quarter tone: ${WEST[q]} · ${ARL[q]} ${ARN[q]}`
        : Math.abs(cents) <= 5 ? 'In tune' : cents > 0 ? 'Sharp: loosen ↓' : 'Flat: tighten ↑';
    });
  };
  $('#startMic').onclick = begin;
  if (Mic.running && !S.settings.tap) begin();
  viewCleanup = () => off && off();
}

/* ---------- Profile tab ---------- */
const GOALS = [[10, 'Casual'], [20, 'Regular'], [30, 'Serious'], [50, 'Intense']];
function xpChart(){
  const days = times(7, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return { d, v:S.daily[dayKey(d)] || 0 }; });
  const max = Math.max(S.goal, ...days.map(x => x.v)) * 1.15, H = 112;
  return `<div class="bars"><div class="goal-line" style="bottom:${20 + S.goal / max * H}px"><span>Goal ${S.goal}</span></div>
    ${days.map((x, i) => `<div class="bar-col ${i === 6 ? 'today' : ''}"><em>${x.v || ''}</em><i style="height:${Math.max(4, x.v / max * H)}px"></i><em>${i === 6 ? 'Today' : 'SMTWTFS'[x.d.getDay()]}</em></div>`).join('')}</div>`;
}
function renderProfile(){
  const doneCount = ALL.filter(x => !x.test && isDone(x.id)).length;
  const explored = MAQAMAT.filter(m => routeIds(m.id).some(isDone)).length;
  const since = new Date(`${S.joined}T12:00`).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const week = times(7, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return S.daily[dayKey(d)] || 0; }).reduce((a, b) => a + b, 0);
  const todayXp = S.daily[dayKey()] || 0;
  const tile = (ico, c, v, label) => `<div class="tile" style="color:var(${c})">${icon(ico)}<div><b style="color:var(--ink)">${v}</b><span>${label}</span></div></div>`;
  $('#view').innerHTML = `<div class="stack">
    <div class="panel hero">
      <div class="avatar">${mascot()}<button id="dress" aria-label="Change Oudi's outfit">${icon('i-shop')}</button></div>
      <div class="hero-info">
        <input class="name-input" id="pname" maxlength="24" aria-label="Your name">
        <p>Learning oud by ear since ${since}</p>
        <div class="chips"><span class="chip">${(TUNINGS[S.settings.tuning] || TUNINGS.FF).label} tuning</span><span class="chip">Route: ${MAQ[S.maqam].name}</span><span class="chip">${S.badges.length} of ${BADGES.length} achievements</span></div>
      </div>
    </div>

    <div class="panel acct"><span class="qi" style="--c:var(--sky)">${icon('i-user')}</span>
      <div><b>${Cloud.user ? esc(Cloud.user.email) : 'Guest'}</b><p><span id="syncState" class="sync"></span></p></div>
      ${Cloud.user ? `<button class="btn ghost" id="logout">Log out</button>`
        : Cloud.enabled() ? `<button class="btn" id="mkAcct">Create account</button><button class="link" id="doLogin">Log in</button>` : ''}
    </div>

    <h3>Statistics</h3>
    <div class="tiles t3">
      ${tile('i-fire', '--amber', liveStreak(), 'Day streak')}
      ${tile('i-trophy', '--amber', S.bestStreak, 'Best streak')}
      ${tile('i-bolt', '--violet', S.xp, 'Total XP')}
      ${tile('i-pearl', '--pearl', S.pearls, 'Pearls')}
      ${tile('i-check', '--primary', doneCount, 'Lessons finished')}
      ${tile('i-map', '--plum', `${explored}/${MAQAMAT.length}`, 'Maqamat explored')}
    </div>

    <div class="panel stack">
      <div class="panel-head"><div class="streak-big">${icon('i-fire')}<div><b>${liveStreak()}</b><p>day streak</p></div></div>
        <button class="btn ghost" id="getFreeze">${icon('i-freeze')} ${S.freezes}/2 freezes</button></div>
      ${weekHtml()}
      <p class="muted-line">${(S.daily[dayKey()] || 0) > 0 ? 'Done for today. Your streak is safe.' : 'Finish one lesson today to keep your streak.'}</p>
    </div>

    <div class="panel stack">
      <div class="panel-head"><h3>XP this week</h3><b style="font-variant-numeric:tabular-nums;color:var(--violet)">${week} XP</b></div>
      ${xpChart()}
      <div class="field" style="border-top:2px solid var(--line)"><div><label>Daily goal</label><p>Today: ${todayXp} of ${S.goal} XP</p></div>
        <div class="seg" id="goal">${GOALS.map(([v, l]) => `<button data-v="${v}" aria-pressed="${S.goal === v}" title="${v} XP a day">${l}</button>`).join('')}</div></div>
    </div>

    <h3>Achievements</h3>
    <div class="badges">${BADGES.map(b => { const v = Math.min(b.val(), b.goal), got = S.badges.includes(b.id) || v >= b.goal;
      return `<div class="bdg ${got ? '' : 'locked'}" style="--c:var(${b.c});--c-d:var(${b.c}-d)"><span class="bi">${icon(b.icon)}</span>
        <div><b>${b.name}</b><p>${b.desc}</p>${got ? '' : `<div class="qbar"><i style="width:${v / b.goal * 100}%"></i></div><p>${v} / ${b.goal}</p>`}</div></div>`; }).join('')}</div>

    <h3>Your ear map</h3>
    <div class="panel stack">${earMap()}</div>

    <h3>Settings</h3>
    <div class="panel">
      <div class="field"><div><label>Oud tuning</label><p>Lowest course to highest</p></div>
        <div class="seg" id="tuning">${Object.entries(TUNINGS).map(([k, t]) => `<button data-v="${k}" aria-pressed="${(S.settings.tuning || 'FF') === k}">${t.label}</button>`).join('')}</div></div>
      <div class="field"><div><label>Note names</label><p>How notes are written in lessons</p></div>
        <div class="seg" id="names"><button data-v="western" aria-pressed="${S.settings.names === 'western'}">C D E</button><button data-v="solfege" aria-pressed="${S.settings.names === 'solfege'}">Do Re Mi</button></div></div>
      <div class="field"><div><label>Answer with</label><p>Your oud through the mic, or on-screen keys</p></div>
        <div class="seg" id="input"><button data-v="mic" aria-pressed="${!S.settings.tap}">My oud</button><button data-v="tap" aria-pressed="${S.settings.tap}">Keys</button></div></div>
      <div class="field"><div><label for="sens">Mic sensitivity</label><p>Lower it if talking or room noise gets picked up; raise it if soft plucks are missed</p></div>
        <input type="range" id="sens" min="1" max="10" value="${S.settings.sens}"></div>
      <div class="field"><div><label>Mic check</label><p>Measures your room and your oud, then sets the sensitivity for you</p></div>
        <button class="btn ghost" id="micCheck">Run mic check</button></div>
      <div class="field"><div><label for="vol">Volume</label><p>How loud Samaa plays notes</p></div>
        <input type="range" id="vol" min="0.1" max="1" step="0.05" value="${S.settings.volume}"></div>
      <div class="field"><div><label>Tonic first</label><p>In maqam routes, play the home note before each phrase</p></div>
        <div class="seg" id="tonic"><button data-v="1" aria-pressed="${!!S.settings.tonic}">On</button><button data-v="0" aria-pressed="${!S.settings.tonic}">Off</button></div></div>
      <div class="field"><div><label>Theme</label><p>Light, dark, or follow your device</p></div>
        <div class="seg" id="theme">${[['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${(S.settings.theme || 'system') === v}">${l}</button>`).join('')}</div></div>
      <div class="field"><div><label>Reset progress</label><p>Clears XP, pearls, streak and finished lessons</p></div>
        <button class="btn ghost" id="reset">Reset</button></div>
    </div></div>`;
  const nameEl = $('#pname'); nameEl.value = S.player;
  nameEl.onchange = () => { S.player = nameEl.value.trim() || 'Oud player'; nameEl.value = S.player; save(); };
  $('#dress').onclick = () => go('shop');
  $('#getFreeze').onclick = () => go('shop');
  document.querySelectorAll('#goal button').forEach(b => b.onclick = () => { S.goal = +b.dataset.v; save(); renderProfile(); });
  document.querySelectorAll('#tuning button').forEach(b => b.onclick = () => { S.settings.tuning = b.dataset.v; save(); renderProfile(); });
  document.querySelectorAll('#names button').forEach(b => b.onclick = () => { S.settings.names = b.dataset.v; save(); renderProfile(); });
  document.querySelectorAll('#input button').forEach(b => b.onclick = () => { S.settings.tap = b.dataset.v === 'tap'; save(); renderProfile(); });
  $('#sens').oninput = ev => { S.settings.sens = +ev.target.value; save(); };
  $('#vol').oninput = ev => { S.settings.volume = +ev.target.value; if (master) master.gain.value = 0.9 * S.settings.volume / 0.8; save(); };
  $('#vol').onchange = () => playSeq([55], 0.8);
  $('#micCheck').onclick = () => micCheck(() => { hideAuth(); go('profile'); });
  document.querySelectorAll('#tonic button').forEach(b => b.onclick = () => { S.settings.tonic = b.dataset.v === '1'; save(); renderProfile(); });
  document.querySelectorAll('#theme button').forEach(b => b.onclick = () => { S.settings.theme = b.dataset.v; save(); applyTheme(); renderProfile(); });
  if ($('#logout')) $('#logout').onclick = logOut;
  if ($('#mkAcct')) $('#mkAcct').onclick = authSignup;
  if ($('#doLogin')) $('#doLogin').onclick = authLogin;
  paintSync();
  $('#reset').onclick = () => {
    openModal(`<h3>Reset all progress?</h3><p>This clears your XP, pearls, streak, outfits and finished lessons on this device.</p>
      <div class="row"><button class="btn" onclick="closeModal()">Keep it</button><button class="btn bad" id="yes">Reset</button></div>`);
    $('#yes').onclick = () => { const st = S.settings, nm = S.player; Object.assign(S, JSON.parse(JSON.stringify(DEFAULT)), { settings:st, player:nm, joined:dayKey() }); save(); closeModal(); go('profile'); };
  };
}

function earMap(){
  const rows = Object.entries(S.ear).map(([k, [h, x]]) => ({ k, h, x, n:h + x, acc:h / (h + x), label:earLabel(k), mq:k.split('|')[0] }))
    .sort((a, b) => a.acc - b.acc || b.n - a.n);
  if (!rows.length) return `<p style="margin:0;color:var(--muted)">Play notes back in lessons, and this map shows which ones you hit on the first try.</p>`;
  const tone = a => a >= 0.8 ? '--primary' : a >= 0.5 ? '--amber' : '--coral';
  return `<div class="ear-map">${rows.map(r => `<div class="ear" style="--c:var(${tone(r.acc)})" title="${r.h} of ${r.n} on the first try">
      <b>${esc(r.label)}</b><span>${Math.round(r.acc * 100)}%</span><small>${r.mq ? MAQ[r.mq].name : 'Level 1'} · ${r.n}×</small></div>`).join('')}</div>
    <div class="legend"><span style="--c:var(--primary)"><i></i>80%+ first try</span><span style="--c:var(--amber)"><i></i>50–79%</span><span style="--c:var(--coral)"><i></i>under 50%: in Tricky notes</span></div>`;
}

/* ---------- keyboard shortcuts (laptop) ---------- */
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
  if (!$('#modal').hidden){ if (ev.key === 'Escape') closeModal(); return; }
  if ($('#lesson').hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const click = sel => { const b = $(sel); if (b && !b.disabled && !b.hidden){ b.click(); return true; } return false; };
  const k = ev.key.toLowerCase();
  if (k === ' ' || k === 'enter'){
    ev.preventDefault(); if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (k === ' ') click('#play'); else click('#next') || click('#check') || click('#fin');
  } else if (k === 'escape') click('#quit');
  else if (/^[1-4]$/.test(k)){ const c = document.querySelectorAll('.choice')[+k - 1]; if (c && !c.disabled) c.click(); }
  else {
    const pads = document.querySelectorAll('.listen .pk'), w = 'asdfghjkl'.indexOf(k), b = 'wetyu'.indexOf(k);
    if (pads.length && w >= 0) pads[w]?.click();
    else if (w >= 0) document.querySelectorAll('.listen .wk')[w]?.click();
    else if (b >= 0) document.querySelectorAll('.listen .bk')[b]?.click();
  }
});

/* ---------- start-up ---------- */
function applyTheme(){ const t = S.settings.theme; if (!t || t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; }
function enterApp(){ hideAuth(); if (!S.joined){ S.joined = dayKey(); save(); } settleStreak(); go('learn'); }
async function boot(){
  applyTheme();
  Cloud.init();
  if (Cloud.enabled()){
    Cloud.sb.auth.onAuthStateChange((evt, session) => { if (evt === 'PASSWORD_RECOVERY'){ Cloud.user = session ? session.user : null; authNewPassword(); } });
    if (/type=recovery/.test(location.hash)) return;   // the recovery event above takes over
    try {
      const { data } = await Cloud.sb.auth.getSession();
      if (data.session){ Cloud.user = data.session.user; return afterLogin(); }
    } catch(e){}
  }
  if (S.onboarded && (S.guest || !Cloud.enabled())) return enterApp();
  authWelcome();
}
if (!S.settings.mic2){ S.settings.sens = 6; S.settings.mic2 = true; save(); }   // new noise filter: new default sensitivity
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
setInterval(() => { if ($('#auth').hidden) renderStats(); }, 60000);
</script>
